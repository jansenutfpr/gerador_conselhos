language: node_js

node_js:
  - 18
  - 20

cache:
  directories:
    - node_modules

branches:
  only:
    - main
    - master

install:
  - npm ci

script:
  - npm run lint || true
  - npm test || true
  - npm run build

before_deploy:
  - chmod +x ./deploy.sh

deploy:
  provider: script
  script: bash deploy.sh
  skip_cleanup: true
  on:
    branch: main

notifications:
  email:
    on_success: change
    on_failure: always
